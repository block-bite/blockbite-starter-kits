name: Starter artifacts
on:
  pull_request:
  push:
    branches: [main]
jobs:
  miette:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm run build:miette
      - uses: actions/upload-artifact@v4
        with:
          name: miette-source
          path: dist/miette-1.0.0.json
